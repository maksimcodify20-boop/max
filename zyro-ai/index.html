<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070711"><title>Zyro AI — умный AI-помощник</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#070711;color:#f7f7fb}button,textarea{font:inherit}:root{--line:rgba(255,255,255,.09);--muted:#8f90a5;--p:#8b5cf6;--pk:#ec4899;--c:#22d3ee}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 15% 10%,rgba(139,92,246,.22),transparent 30%),radial-gradient(circle at 88% 80%,rgba(34,211,238,.13),transparent 28%)}.app{position:relative;height:100%;display:flex}.sidebar{width:285px;flex:none;padding:16px;display:flex;flex-direction:column;gap:15px;background:rgba(8,8,17,.8);border-right:1px solid var(--line);backdrop-filter:blur(24px);transition:.28s}.logo{display:flex;align-items:center;gap:11px;padding:5px 4px 10px;font-size:20px;font-weight:850}.logoMark,.orb{display:grid;place-items:center;background:linear-gradient(135deg,var(--p),var(--pk),var(--c));box-shadow:0 15px 45px rgba(139,92,246,.3)}.logoMark{width:42px;height:42px;border-radius:14px}.new{width:100%;border:1px solid rgba(255,255,255,.12);color:#fff;background:linear-gradient(135deg,rgba(139,92,246,.28),rgba(34,211,238,.08));padding:13px 15px;border-radius:14px;font-weight:750;cursor:pointer}.new:hover{transform:translateY(-1px)}.sectionTitle{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:#6f7187;margin:8px 4px 0}.history{overflow:auto;flex:1}.chatItem{padding:11px 12px;border-radius:12px;color:#c9cad7;font-size:14px;margin-top:5px}.chatItem.active,.chatItem:hover{background:rgba(255,255,255,.055)}.sideBottom{border-top:1px solid var(--line);padding-top:14px;color:#77798d;font-size:11px;line-height:1.6}.main{min-width:0;flex:1;display:flex;flex-direction:column}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid var(--line);background:rgba(7,7,17,.55);backdrop-filter:blur(20px)}.topLeft{display:flex;align-items:center;gap:11px}.menu{display:none;background:none;border:0;color:#fff;font-size:23px}.title{font-weight:800}.online{display:flex;align-items:center;gap:7px;color:#86efac;font-size:12px}.online i{width:8px;height:8px;background:#4ade80;border-radius:50%;box-shadow:0 0 14px #4ade80}.chat{flex:1;overflow:auto;padding:25px 18px 175px}.inner{width:min(950px,100%);margin:auto}.welcome{min-height:62vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;animation:fade .5s}.orb{width:92px;height:92px;border-radius:28px;font-size:39px;animation:float 4s ease-in-out infinite}.welcome h1{font-size:clamp(34px,5vw,56px);line-height:1.02;letter-spacing:-2px;margin:24px 0 12px}.gradient{background:linear-gradient(90deg,#fff,#b8a6ff,#77e8f5);-webkit-background-clip:text;background-clip:text;color:transparent}.welcome p{max-width:660px;color:var(--muted);line-height:1.7;margin:0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(850px,100%);margin-top:30px}.card{min-height:110px;text-align:left;border:1px solid var(--line);border-radius:17px;padding:15px;background:rgba(255,255,255,.035);color:#e8e8f0;cursor:pointer;transition:.22s}.card:hover{transform:translateY(-4px);background:rgba(255,255,255,.07);border-color:rgba(139,92,246,.4)}.card b{display:block;font-size:14px;margin:11px 0 5px}.card span{font-size:11px;color:#85869a;line-height:1.4}.message{display:flex;gap:12px;margin:24px 0;animation:up .25s}.avatar{width:38px;height:38px;min-width:38px;border-radius:12px;display:grid;place-items:center}.ai .avatar{background:linear-gradient(135deg,var(--p),var(--pk),var(--c))}.user .avatar{background:#252538}.bubble{max-width:calc(100% - 50px);line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{padding:12px 15px;border-radius:17px;background:rgba(139,92,246,.14);border:1px solid rgba(139,92,246,.2)}.actions{margin-top:8px}.action{border:1px solid var(--line);background:transparent;color:#77798d;border-radius:8px;padding:4px 8px;font-size:11px;cursor:pointer}.action:hover{color:#fff}.typing{display:flex;gap:5px;padding:9px 0}.typing i{width:7px;height:7px;border-radius:50%;background:#aaa;animation:b 1s infinite}.typing i:nth-child(2){animation-delay:.14s}.typing i:nth-child(3){animation-delay:.28s}.composerWrap{position:fixed;left:285px;right:0;bottom:0;padding:18px 20px 20px;background:linear-gradient(transparent,rgba(7,7,17,.97) 38%)}.composer{width:min(950px,100%);margin:auto;border:1px solid rgba(255,255,255,.13);background:rgba(18,18,31,.92);box-shadow:0 20px 60px rgba(0,0,0,.35),inset 0 1px rgba(255,255,255,.05);border-radius:20px;padding:9px;display:flex;align-items:flex-end;gap:8px}.composer:focus-within{border-color:rgba(139,92,246,.55)}textarea{flex:1;resize:none;max-height:150px;min-height:48px;background:transparent;border:0;outline:0;color:#fff;padding:11px;font-size:15px;line-height:1.5}textarea::placeholder{color:#66687d}.send{width:48px;height:48px;border:0;border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--p),var(--pk),var(--c));cursor:pointer;font-size:20px}.send:disabled{opacity:.4}.hint{text-align:center;color:#55576b;font-size:10px;margin-top:7px}@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translateY(-6px)}}@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.3}30%{transform:translateY(-5px);opacity:1}}@media(max-width:800px){.sidebar{position:fixed;left:-300px;top:0;bottom:0;z-index:20;box-shadow:25px 0 70px #000}.sidebar.open{left:0}.menu{display:block}.online{display:none}.topbar{padding:0 14px}.composerWrap{left:0;padding:10px 10px 13px}.chat{padding:18px 11px 165px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.card{min-height:105px;padding:12px}.welcome p{font-size:14px}}</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="logo"><div class="logoMark">⚡</div><span>Zyro AI</span></div><button class="new" onclick="newChat()">＋ Новый чат</button><div class="sectionTitle">История</div><div class="history"><div class="chatItem active">✨ Новый разговор</div></div><div class="sideBottom">Zyro AI<br>Powered by Cloudflare Workers AI<br>Локальная история · Быстрый интерфейс</div></aside><main class="main"><header class="topbar"><div class="topLeft"><button class="menu" onclick="toggleSidebar()">☰</button><div class="title">⚡ Zyro AI</div></div><div class="online"><i></i> AI онлайн</div></header><section class="chat" id="chat"><div class="inner" id="inner"><div class="welcome" id="welcome"><div class="orb">✨</div><h1>Привет! Я <span class="gradient">Zyro AI</span></h1><p>Твой быстрый AI-помощник для идей, программирования, учёбы, текстов и создания сайтов.</p><div class="cards"><button class="card" onclick="suggest('Создай современный сайт-портфолио на HTML и CSS')">💻<b>Создать сайт</b><span>Красивый интерфейс с нуля</span></button><button class="card" onclick="suggest('Объясни искусственный интеллект простыми словами')">🧠<b>Объяснить</b><span>Сложное простыми словами</span></button><button class="card" onclick="suggest('Придумай 10 необычных идей для проекта')">💡<b>Придумать</b><span>Идеи для проектов</span></button><button class="card" onclick="suggest('Напиши JavaScript код для красивого интерактивного меню')">⚙️<b>Написать код</b><span>HTML, CSS, JS и другое</span></button></div></div></div></section></main></div><div class="composerWrap"><div class="composer"><textarea id="input" rows="1" placeholder="Спросите что-нибудь у Zyro AI..." autocomplete="off"></textarea><button class="send" id="send" onclick="sendMessage()">➤</button></div><div class="hint">Enter — отправить · Shift + Enter — новая строка</div></div><script>const API_URL="https://restless-recipe-f74f.maksimcodify20.workers.dev";let messages=[];const inner=document.getElementById('inner'),input=document.getElementById('input'),send=document.getElementById('send'),chat=document.getElementById('chat');function save(){localStorage.setItem('zyro_messages',JSON.stringify(messages))}function scroll(){setTimeout(()=>chat.scrollTo({top:chat.scrollHeight,behavior:'smooth'}),30)}function addMessage(role,content,persist=true){const row=document.createElement('div');row.className='message '+(role==='user'?'user':'ai');const av=document.createElement('div');av.className='avatar';av.textContent=role==='user'?'👤':'⚡';const box=document.createElement('div');box.className='bubble';box.textContent=content;row.append(av,box);if(role==='assistant'){const a=document.createElement('div');a.className='actions';const c=document.createElement('button');c.className='action';c.textContent='Копировать';c.onclick=()=>navigator.clipboard?.writeText(content);a.append(c);box.append(a)}inner.append(row);if(persist){messages.push({role,content});save()}scroll()}function typing(on){document.getElementById('typing')?.remove();if(!on)return;const row=document.createElement('div');row.id='typing';row.className='message ai';row.innerHTML='<div class="avatar">⚡</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';inner.append(row);scroll()}async function sendMessage(){const text=input.value.trim();if(!text||send.disabled)return;document.getElementById('welcome')?.remove();addMessage('user',text);input.value='';resize();send.disabled=true;typing(true);try{const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages})});let data={};try{data=await r.json()}catch{}if(!r.ok)throw new Error(data.error||'Ошибка сервера');if(!data.answer)throw new Error('AI не вернул ответ');typing(false);addMessage('assistant',data.answer)}catch(e){typing(false);addMessage('assistant','❌ Не удалось получить ответ.\n'+e.message)}finally{send.disabled=false;input.focus()}}function suggest(t){input.value=t;input.focus();sendMessage()}function resize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'}input.addEventListener('input',resize);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});function newChat(){messages=[];localStorage.removeItem('zyro_messages');location.reload()}function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open')}try{const old=JSON.parse(localStorage.getItem('zyro_messages')||'[]');if(old.length){messages=old;document.getElementById('welcome')?.remove();old.forEach(x=>addMessage(x.role,x.content,false))}}catch{}input.focus();</script></body></html>
