<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Zyro AI</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#fff;height:100vh;display:flex;overflow:hidden;background:radial-gradient(circle at 15% 20%,#7c3aed55,transparent 30%),radial-gradient(circle at 85% 80%,#2563eb55,transparent 30%),linear-gradient(135deg,#070914,#11152b,#090b18)}.side{width:250px;padding:20px;background:#0f1123e8;border-right:1px solid #8b5cf655}.logo{font-size:25px;font-weight:bold;margin-bottom:25px;background:linear-gradient(90deg,#c084fc,#6366f1,#22d3ee);-webkit-background-clip:text;color:transparent}.new{width:100%;padding:13px;border:1px solid #8b5cf688;border-radius:12px;background:#8b5cf633;color:#fff;cursor:pointer}.main{flex:1;display:flex;flex-direction:column}.head{padding:20px;border-bottom:1px solid #8b5cf644;font-weight:bold}.chat{flex:1;overflow:auto;padding:30px}.welcome{text-align:center;margin-top:100px}.welcome h1{font-size:44px;background:linear-gradient(90deg,#c084fc,#818cf8,#22d3ee);-webkit-background-clip:text;color:transparent}.msg{max-width:800px;margin:20px auto;padding:17px 20px;border-radius:16px;line-height:1.6;white-space:pre-wrap}.user{background:linear-gradient(135deg,#4f46e5,#7c3aed,#9333ea)}.ai{background:#171d3eee;border:1px solid #8b5cf655}.name{font-weight:bold;color:#c4b5fd;margin-bottom:7px}.area{padding:20px;border-top:1px solid #8b5cf644}.box{max-width:800px;margin:auto;display:flex;padding:6px;border:1px solid #8b5cf688;border-radius:16px;background:#141832}.input{flex:1;background:transparent;border:0;outline:0;color:#fff;padding:13px;font-size:16px}.send{width:48px;border:0;border-radius:12px;background:linear-gradient(135deg,#8b5cf6,#6366f1,#06b6d4);color:white;font-size:20px;cursor:pointer}.foot{text-align:center;color:#777d8d;font-size:12px;margin-top:10px}@media(max-width:700px){.side{display:none}.welcome h1{font-size:30px}}
</style></head><body><aside class="side"><div class="logo">⚡ Zyro AI</div><button class="new" onclick="newChat()">＋ Новый чат</button></aside><main class="main"><header class="head">⚡ Zyro AI</header><section class="chat" id="chat"><div class="welcome" id="welcome"><h1>Чем я могу помочь?</h1><p>Задай свой вопрос Zyro AI 👇</p></div></section><div class="area"><div class="box"><input class="input" id="input" placeholder="Напиши сообщение..." autocomplete="off"><button class="send" onclick="send()">➤</button></div><div class="foot">Zyro AI — твой AI-помощник</div></div></main><script>
const input=document.getElementById("input"),chat=document.getElementById("chat");input.addEventListener("keydown",e=>{if(e.key==="Enter")send()});function add(n,t,c){let m=document.createElement("div"),a=document.createElement("div"),b=document.createElement("div");m.className="msg "+c;a.className="name";a.textContent=n;b.textContent=t;m.append(a,b);chat.appendChild(m);chat.scrollTop=chat.scrollHeight}function send(){let t=input.value.trim();if(!t)return;let w=document.getElementById("welcome");if(w)w.style.display="none";add("Ты",t,"user");input.value="";setTimeout(()=>add("Zyro AI",answer(t),"ai"),400)}function answer(t){let q=t.toLowerCase();if(q.includes("привет")||q.includes("хай"))return"Привет! 👋 Я Zyro AI. Чем могу помочь?";if(q.includes("кто ты"))return"Я Zyro AI — твой виртуальный AI-помощник ⚡";if(q.includes("html"))return"HTML создаёт структуру сайта.";if(q.includes("css"))return"CSS отвечает за дизайн сайта 🎨";if(q.includes("javascript")||q.includes("js"))return"JavaScript добавляет сайту интерактивность ⚡";if(q.includes("спасибо"))return"Пожалуйста! 😎";if(q.includes("помоги")||q.includes("помощь"))return"Конечно! Напиши, что тебе нужно сделать.";return"Я пока демо-версия Zyro AI 🤖. Для ответов на любые вопросы нужен настоящий AI через сервер и API."}function newChat(){chat.innerHTML='<div class="welcome" id="welcome"><h1>Чем я могу помочь?</h1><p>Задай свой вопрос Zyro AI 👇</p></div>';input.value=""}
</script></body></html>
