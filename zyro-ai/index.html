<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>Zyro AI — умный помощник</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#070b16;--panel:#0d1324;--panel2:#111a2e;--line:rgba(255,255,255,.09);
  --text:#f7f9ff;--muted:#8f9ab5;--purple:#7c5cff;--cyan:#00c6ff;
}
html,body{height:100%}
body{
  font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  color:var(--text);background:var(--bg);overflow:hidden;
}
button,textarea{font:inherit}
.app{height:100%;display:flex;background:
 radial-gradient(circle at 15% 5%,rgba(124,92,255,.16),transparent 28%),
 radial-gradient(circle at 85% 90%,rgba(0,198,255,.10),transparent 30%),var(--bg)}
.sidebar{
 width:276px;flex:none;padding:18px;display:flex;flex-direction:column;gap:18px;
 background:rgba(7,11,22,.88);border-right:1px solid var(--line);backdrop-filter:blur(20px)
}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;font-size:20px}
.brand-icon,.welcome-icon{
 display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--cyan));
 box-shadow:0 12px 38px rgba(124,92,255,.32)
}
.brand-icon{width:40px;height:40px;border-radius:13px}
.new-chat,.suggestion,.send,.mobile-menu{cursor:pointer}
.new-chat{
 border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:13px;color:#fff;font-weight:700;
 background:linear-gradient(135deg,rgba(124,92,255,.20),rgba(0,198,255,.08));transition:.2s
}
.new-chat:hover{transform:translateY(-1px);border-color:rgba(124,92,255,.5)}
.label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em}
.history{flex:1;overflow:auto}
.chat-item{padding:11px 12px;border-radius:11px;color:#cbd3e7;font-size:14px;margin-top:7px}
.chat-item.active,.chat-item:hover{background:rgba(255,255,255,.06)}
.side-note{font-size:11px;line-height:1.6;color:#69748f}
.main{min-width:0;flex:1;display:flex;flex-direction:column}
.header{
 height:68px;flex:none;padding:0 24px;display:flex;align-items:center;justify-content:space-between;
 border-bottom:1px solid var(--line);background:rgba(7,11,22,.62);backdrop-filter:blur(18px)
}
.title{display:flex;align-items:center;gap:10px;font-weight:800}
.status{display:flex;align-items:center;gap:7px;color:#82f7ae;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:#39e879;box-shadow:0 0 13px #39e879}
.chat{flex:1;overflow-y:auto;padding:30px 18px 180px;scroll-behavior:smooth}
.inner{width:min(920px,100%);margin:auto}
.welcome{min-height:58vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.welcome-icon{width:82px;height:82px;border-radius:25px;font-size:38px;margin-bottom:22px}
.welcome h1{font-size:clamp(31px,5vw,46px);letter-spacing:-1.5px;margin-bottom:12px}
.welcome p{max-width:650px;color:var(--muted);line-height:1.65}
.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;width:min(720px,100%);margin-top:28px}
.suggestion{
 text-align:left;padding:15px;border:1px solid var(--line);border-radius:15px;color:#e2e7f4;
 background:rgba(255,255,255,.035);transition:.2s
}
.suggestion:hover{background:rgba(255,255,255,.075);transform:translateY(-2px);border-color:rgba(124,92,255,.35)}
.message{display:flex;gap:12px;margin:23px 0;animation:up .22s ease}
@keyframes up{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.avatar{width:38px;height:38px;min-width:38px;border-radius:12px;display:grid;place-items:center;font-size:16px}
.ai .avatar{background:linear-gradient(135deg,var(--purple),var(--cyan))}
.user .avatar{background:#273149}
.bubble{max-width:calc(100% - 52px);line-height:1.72;white-space:pre-wrap;overflow-wrap:anywhere}
.user .bubble{
 padding:12px 15px;border-radius:16px;background:rgba(103,84,232,.18);
 border:1px solid rgba(103,84,232,.25)
}
.typing{display:flex;gap:5px;padding:10px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:#aab5d1;animation:b 1.1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0);opacity:.35}30%{transform:translateY(-5px);opacity:1}}
.input-area{
 position:fixed;left:276px;right:0;bottom:0;padding:20px 24px 23px;
 background:linear-gradient(transparent,rgba(7,11,22,.97) 38%)
}
.composer{
 width:min(920px,100%);margin:auto;display:flex;align-items:flex-end;gap:9px;padding:9px;
 border:1px solid rgba(255,255,255,.13);border-radius:20px;background:rgba(17,26,46,.96);
 box-shadow:0 18px 55px rgba(0,0,0,.32),inset 0 1px rgba(255,255,255,.05)
}
textarea{
 flex:1;min-height:48px;max-height:150px;resize:none;outline:none;border:0;background:transparent;
 color:#fff;padding:11px;font-size:15px;line-height:1.5
}
textarea::placeholder{color:#71809f}
.send{
 width:47px;height:47px;border:0;border-radius:14px;color:#fff;font-size:20px;
 background:linear-gradient(135deg,var(--purple),var(--cyan));transition:.2s
}
.send:hover{transform:scale(1.04)}.send:disabled{opacity:.45;cursor:not-allowed;transform:none}
.hint{text-align:center;color:#66728e;font-size:11px;margin-top:8px}
.mobile-menu{display:none;border:0;background:transparent;color:#fff;font-size:23px}
@media(max-width:760px){
 .sidebar{position:fixed;z-index:30;left:-295px;top:0;bottom:0;transition:.25s}
 .sidebar.open{left:0;box-shadow:20px 0 60px rgba(0,0,0,.4)}
 .mobile-menu{display:block}.header{padding:0 14px}
 .input-area{left:0;padding:11px 12px 14px}.chat{padding:22px 12px 170px}
 .suggestions{grid-template-columns:1fr}.status{display:none}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-icon">⚡</div><span>Zyro AI</span></div>
    <button class="new-chat" onclick="newChat()">＋ Новый чат</button>
    <div class="label">Чаты</div>
    <div class="history"><div class="chat-item active">⚡ Новый разговор</div></div>
    <div class="side-note">Zyro AI<br>Powered by Cloudflare Workers AI</div>
  </aside>

  <main class="main">
    <header class="header">
      <button class="mobile-menu" onclick="toggleSidebar()">☰</button>
      <div class="title">⚡ Zyro AI</div>
      <div class="status"><span class="dot"></span> AI онлайн</div>
    </header>

    <section class="chat" id="chat">
      <div class="inner" id="chatInner">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">✨</div>
          <h1>Чем я могу помочь?</h1>
          <p>Умный AI-помощник для вопросов, идей, программирования, текстов и объяснений.</p>
          <div class="suggestions">
            <button class="suggestion" onclick="useSuggestion('Напиши красивый HTML сайт')">💻 Создать сайт</button>
            <button class="suggestion" onclick="useSuggestion('Объясни искусственный интеллект простыми словами')">🧠 Объяснить сложное</button>
            <button class="suggestion" onclick="useSuggestion('Придумай идею для бизнеса')">💡 Придумать идею</button>
            <button class="suggestion" onclick="useSuggestion('Напиши программу на JavaScript')">⚙️ Написать код</button>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="input-area">
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Напишите сообщение..." autocomplete="off"></textarea>
    <button class="send" id="send" onclick="sendMessage()" title="Отправить">➤</button>
  </div>
  <div class="hint">Enter — отправить · Shift + Enter — новая строка</div>
</div>

<script>
/* Твой настоящий Cloudflare Worker */
const API_URL = "https://calm-rice-2fe8zyro-ai-api.maksimcodify20.workers.dev";

let messages = [];
const chat = document.getElementById("chatInner");
const input = document.getElementById("input");
const sendButton = document.getElementById("send");

function saveChat(){
  localStorage.setItem("zyro_messages", JSON.stringify(messages));
}

function loadChat(){
  try{
    const saved = JSON.parse(localStorage.getItem("zyro_messages") || "[]");
    if(Array.isArray(saved) && saved.length){
      messages = saved;
      document.getElementById("welcome")?.remove();
      messages.forEach(m => addMessage(m.role,m.content,false));
    }
  }catch(e){}
}

function addMessage(role, content, save=true){
  const row=document.createElement("div");
  row.className="message "+(role==="user"?"user":"ai");

  const avatar=document.createElement("div");
  avatar.className="avatar";
  avatar.textContent=role==="user"?"👤":"⚡";

  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.textContent=content;

  row.append(avatar,bubble);
  chat.appendChild(row);

  if(save){
    messages.push({role,content});
    saveChat();
  }
  scrollBottom();
}

function showTyping(){
  const row=document.createElement("div");
  row.className="message ai";row.id="typing";

  const avatar=document.createElement("div");
  avatar.className="avatar";avatar.textContent="⚡";

  const bubble=document.createElement("div");
  bubble.className="bubble";
  bubble.innerHTML='<div class="typing"><i></i><i></i><i></i></div>';

  row.append(avatar,bubble);chat.appendChild(row);scrollBottom();
}

function hideTyping(){document.getElementById("typing")?.remove()}

async function sendMessage(){
  const text=input.value.trim();
  if(!text || sendButton.disabled)return;

  document.getElementById("welcome")?.remove();
  addMessage("user",text);
  input.value="";input.style.height="48px";
  sendButton.disabled=true;showTyping();

  try{
    const response=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({messages})
    });

    let data={};
    try{data=await response.json()}catch(e){}

    hideTyping();

    if(!response.ok) throw new Error(data.error || ("HTTP "+response.status));
    if(!data.answer) throw new Error("AI не вернул ответ");

    addMessage("assistant",data.answer);
  }catch(error){
    hideTyping();
    addMessage("assistant","❌ Ошибка подключения к AI.\n\n"+error.message+"\n\nЕсли Worker ещё показывает Hello World, замени его код на код Worker, который я дал тебе.");
  }finally{
    sendButton.disabled=false;input.focus();
  }
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();sendMessage();
  }
});

input.addEventListener("input",function(){
  this.style.height="auto";
  this.style.height=Math.min(this.scrollHeight,150)+"px";
});

function useSuggestion(text){input.value=text;input.focus();sendMessage()}

function newChat(){
  messages=[];localStorage.removeItem("zyro_messages");
  chat.innerHTML='<div class="welcome" id="welcome"><div class="welcome-icon">✨</div><h1>Чем я могу помочь?</h1><p>Умный AI-помощник для вопросов, идей, программирования, текстов и объяснений.</p><div class="suggestions"><button class="suggestion" onclick="useSuggestion(\'Напиши красивый HTML сайт\')">💻 Создать сайт</button><button class="suggestion" onclick="useSuggestion(\'Объясни искусственный интеллект простыми словами\')">🧠 Объяснить сложное</button><button class="suggestion" onclick="useSuggestion(\'Придумай идею для бизнеса\')">💡 Придумать идею</button><button class="suggestion" onclick="useSuggestion(\'Напиши программу на JavaScript\')">⚙️ Написать код</button></div></div>';
  input.focus();
}

function scrollBottom(){
  setTimeout(()=>document.getElementById("chat").scrollTo({top:document.getElementById("chat").scrollHeight,behavior:"smooth"}),30);
}

function toggleSidebar(){document.getElementById("sidebar").classList.toggle("open")}

loadChat();input.focus();
</script>
</body>
</html>
