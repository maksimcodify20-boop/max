<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080815"><title>Сообщить об ошибке — Zyro AI</title><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px;display:grid;place-items:center;background:radial-gradient(circle at 15% 10%,#30205b,transparent 35%),radial-gradient(circle at 90% 85%,#10313b,transparent 35%),#080815;color:#f7f7fb;font-family:Inter,system-ui,Segoe UI,sans-serif}.panel{width:min(560px,100%);padding:28px;border:1px solid #ffffff20;border-radius:24px;background:#111120ef;box-shadow:0 24px 80px #0007}a{color:#c4b5fd;text-decoration:none}.logo{font-weight:850;font-size:19px;margin-bottom:24px}.logo span{color:#c4b5fd}h1{font-size:30px;margin:0 0 8px}p{color:#a5a5ba;line-height:1.6;margin:0 0 22px}label{display:block;font-size:13px;color:#d8d8e7;margin:15px 0 7px}input,textarea{width:100%;padding:13px 14px;border:1px solid #ffffff20;border-radius:12px;background:#090914;color:white;font:inherit;outline:none}input:focus,textarea:focus{border-color:#8b5cf6}textarea{min-height:150px;resize:vertical}#captcha{margin-top:16px;min-height:65px}button{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;background:linear-gradient(110deg,#8b5cf6,#d946ef,#22d3ee);color:white;font-weight:800;font-size:15px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#status{margin-top:15px;white-space:pre-wrap;font-size:14px}.back{display:inline-block;margin-top:18px;color:#a5a5ba;font-size:13px}
</style></head><body><main class="panel"><div class="logo">⚡ <span>Zyro AI</span></div><h1>Сообщить об ошибке</h1><p>Опиши, что произошло. Сообщение отправится команде Zyro AI в Telegram.</p><form id="reportForm"><label for="name">Твоё имя</label><input id="name" name="name" maxlength="100" required placeholder="Как тебя зовут?"><label for="contact">Контакт для ответа</label><input id="contact" name="contact" maxlength="160" required placeholder="Telegram, email или телефон"><div id="captcha"></div><label for="error">Что случилось?</label><textarea id="error" name="error" maxlength="1500" required placeholder="Опиши ошибку и что ты делал перед её появлением…"></textarea><button id="send" type="submit">Отправить ошибку</button><div id="status" role="status"></div></form><a class="back" href="/zyro-ai/">← Вернуться в Zyro AI</a></main><script>
const API="https://restless-recipe-f74f.maksimcodify20.workers.dev";
const SITE_KEY="0x4AAAAAAFbUU94-IbQQ16z1";
const form=document.getElementById("reportForm"),button=document.getElementById("send"),status=document.getElementById("status");
let widgetId=null,pending=null;
function waitCaptcha(){return new Promise((resolve,reject)=>{const start=Date.now();(function check(){if(window.turnstile)return resolve();if(Date.now()-start>20000)return reject(new Error("CAPTCHA не загрузилась. Обнови страницу."));setTimeout(check,150)})()})}
async function captchaToken(){await waitCaptcha();if(widgetId===null){widgetId=turnstile.render(document.getElementById("captcha"),{sitekey:SITE_KEY,theme:"dark",callback:t=>pending?.resolve(t),"error-callback":()=>pending?.reject(new Error("CAPTCHA не прошла проверку."))})}const current=turnstile.getResponse(widgetId);if(current)return current;return new Promise((resolve,reject)=>{let done=false;const finish=(err,t)=>{if(done)return;done=true;clearTimeout(timer);pending=null;err?reject(err):resolve(t)};const timer=setTimeout(()=>finish(new Error("Подтверди CAPTCHA.")),120000);pending={resolve:t=>finish(null,t),reject:e=>finish(e)}})}
form.addEventListener("submit",async e=>{e.preventDefault();button.disabled=true;status.textContent="Проверяем CAPTCHA и отправляем…";
const name=document.getElementById("name").value.trim(),contact=document.getElementById("contact").value.trim(),details=document.getElementById("error").value.trim();
try{const token=await captchaToken();const response=await fetch(API+"/lead",{method:"POST",headers:{"Content-Type":"application/json","X-Turnstile-Token":token,"X-Captcha-Token":token},body:JSON.stringify({name,contact,service:"Сообщение об ошибке на сайте Zyro AI",budget:"Не указано",details:"ОШИБКА САЙТА\\n"+details,turnstileToken:token,captcha_token:token,captchaToken:token,"cf-turnstile-response":token})});
let data={};try{data=await response.json()}catch{}
if(!response.ok||data.success===false||data.ok===false||data.error)throw new Error(data.error||data.message||"Сервер не принял сообщение (HTTP "+response.status+").");
status.textContent="✅ Сервер принял сообщение. Если Worker настроен на отправку заявок, оно доставлено в Telegram.";form.reset();if(window.turnstile&&widgetId!==null)turnstile.reset(widgetId);
}catch(err){status.textContent="❌ Не удалось отправить: "+(err.message||"ошибка соединения")+". Попробуй ещё раз."}
finally{button.disabled=false}});
</script></body></html>
