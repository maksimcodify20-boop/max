<!DOCTYPE html>
<html lang="ru">
<head>
 
<title>Zyro AI — бесплатный искусственный интеллект онлайн</title>

<meta name="description" content="Zyro AI — умный ИИ-помощник онлайн. Задавай вопросы, получай ответы, изучай программирование и создавай идеи бесплатно.">

<meta name="robots" content="index, follow">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: #070711;
      color: #fff;
    }

    body {
      overflow: hidden;
    }

    button,
    textarea {
      font: inherit;
    }

    :root {
      --purple: #8b5cf6;
      --pink: #ec4899;
      --cyan: #22d3ee;

      --background: #070711;
      --panel: rgba(16, 16, 29, 0.82);
      --border: rgba(255, 255, 255, 0.09);
      --text: #f7f7fb;
      --muted: #8f90a5;
    }

    /* BACKGROUND */

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;

      background:
        radial-gradient(
          circle at 15% 10%,
          rgba(139, 92, 246, 0.25),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(34, 211, 238, 0.15),
          transparent 30%
        );
    }

    /* APP */

    .app {
      position: relative;
      z-index: 1;

      width: 100%;
      height: 100%;

      display: flex;
    }

    /* SIDEBAR */

    .sidebar {
      width: 285px;

      padding: 16px;

      display: flex;
      flex-direction: column;
      gap: 15px;

      background: rgba(8, 8, 17, 0.85);

      border-right: 1px solid var(--border);

      backdrop-filter: blur(25px);

      transition: 0.3s;
    }

    .logo {
      display: flex;
      align-items: center;

      gap: 11px;

      padding: 5px 4px 10px;

      font-size: 20px;
      font-weight: 800;
    }

    .logo-icon {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      font-size: 20px;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--pink),
          var(--cyan)
        );

      box-shadow:
        0 15px 45px
        rgba(139, 92, 246, 0.35);
    }

    .new-chat {
      width: 100%;

      padding: 13px 15px;

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;

      color: white;

      background:
        linear-gradient(
          135deg,
          rgba(139, 92, 246, 0.3),
          rgba(34, 211, 238, 0.08)
        );

      cursor: pointer;

      font-weight: 700;

      transition: 0.2s;
    }

    .new-chat:hover {
      transform: translateY(-2px);

      border-color: rgba(139, 92, 246, 0.6);
    }

    .section-title {
      margin-top: 8px;

      color: #6f7187;

      font-size: 11px;

      text-transform: uppercase;

      letter-spacing: 0.15em;
    }

    .history {
      flex: 1;

      overflow-y: auto;
    }

    .history-item {
      padding: 11px 12px;

      margin-top: 5px;

      border-radius: 12px;

      color: #c9cad7;

      font-size: 14px;

      cursor: pointer;

      transition: 0.2s;
    }

    .history-item:hover,
    .history-item.active {
      background: rgba(255, 255, 255, 0.06);
    }

    .sidebar-bottom {
      padding-top: 14px;

      border-top: 1px solid var(--border);

      color: #77798d;

      font-size: 11px;

      line-height: 1.6;
    }

    /* MAIN */

    .main {
      min-width: 0;

      flex: 1;

      display: flex;
      flex-direction: column;
    }

    /* TOPBAR */

    .topbar {
      height: 68px;

      display: flex;

      align-items: center;
      justify-content: space-between;

      padding: 0 24px;

      background: rgba(7, 7, 17, 0.6);

      border-bottom: 1px solid var(--border);

      backdrop-filter: blur(20px);
    }

    .top-left {
      display: flex;
      align-items: center;

      gap: 12px;
    }

    .menu-button {
      display: none;

      border: none;

      color: white;

      background: transparent;

      font-size: 23px;

      cursor: pointer;
    }

    .title {
      font-weight: 800;
    }

    .online {
      display: flex;

      align-items: center;

      gap: 7px;

      color: #86efac;

      font-size: 12px;
    }

    .online-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #4ade80;

      box-shadow:
        0 0 14px #4ade80;
    }

    /* CHAT */

    .chat {
      flex: 1;

      overflow-y: auto;

      padding: 25px 18px 180px;
    }

    .inner {
      width: min(950px, 100%);

      margin: auto;
    }

    /* WELCOME */

    .welcome {
      min-height: 62vh;

      display: flex;

      flex-direction: column;

      align-items: center;
      justify-content: center;

      text-align: center;

      animation: fadeIn 0.5s ease;
    }

    .orb {
      width: 92px;
      height: 92px;

      display: grid;
      place-items: center;

      border-radius: 28px;

      font-size: 40px;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--pink),
          var(--cyan)
        );

      box-shadow:
        0 0 0 8px rgba(139, 92, 246, 0.05),
        0 25px 80px
        rgba(139, 92, 246, 0.35);

      animation: float 4s ease-in-out infinite;
    }

    .welcome h1 {
      margin: 24px 0 12px;

      font-size: clamp(34px, 5vw, 56px);

      line-height: 1;

      letter-spacing: -2px;
    }

    .gradient {
      background:
        linear-gradient(
          90deg,
          #ffffff,
          #b8a6ff,
          #77e8f5
        );

      -webkit-background-clip: text;
      background-clip: text;

      color: transparent;
    }

    .welcome p {
      max-width: 650px;

      margin: 0;

      color: var(--muted);

      line-height: 1.7;
    }

    /* CARDS */

    .cards {
      width: min(850px, 100%);

      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 10px;

      margin-top: 30px;
    }

    .card {
      min-height: 110px;

      padding: 15px;

      text-align: left;

      border: 1px solid var(--border);

      border-radius: 17px;

      color: #e8e8f0;

      background: rgba(255, 255, 255, 0.035);

      cursor: pointer;

      transition: 0.22s;
    }

    .card:hover {
      transform: translateY(-5px);

      background: rgba(255, 255, 255, 0.07);

      border-color:
        rgba(139, 92, 246, 0.45);
    }

    .card-icon {
      font-size: 20px;
    }

    .card b {
      display: block;

      margin: 10px 0 5px;

      font-size: 14px;
    }

    .card span {
      color: #85869a;

      font-size: 11px;

      line-height: 1.4;
    }

    /* MESSAGES */

    .message {
      display: flex;

      gap: 12px;

      margin: 24px 0;

      animation: messageIn 0.25s ease;
    }

    .avatar {
      width: 38px;
      height: 38px;

      min-width: 38px;

      display: grid;
      place-items: center;

      border-radius: 12px;
    }

    .ai .avatar {
      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--pink),
          var(--cyan)
        );
    }

    .user .avatar {
      background: #252538;
    }

    .bubble {
      max-width: calc(100% - 50px);

      line-height: 1.75;

      white-space: pre-wrap;

      overflow-wrap: anywhere;
    }

    .user .bubble {
      padding: 12px 15px;

      border-radius: 17px;

      background:
        rgba(139, 92, 246, 0.14);

      border:
        1px solid
        rgba(139, 92, 246, 0.2);
    }

    .actions {
      margin-top: 8px;
    }

    .copy-button {
      padding: 5px 9px;

      border: 1px solid var(--border);

      border-radius: 8px;

      color: #77798d;

      background: transparent;

      font-size: 11px;

      cursor: pointer;
    }

    .copy-button:hover {
      color: white;

      background: rgba(255, 255, 255, 0.06);
    }

    /* TYPING */

    .typing {
      display: flex;

      gap: 5px;

      padding: 9px 0;
    }

    .typing span {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #aaa;

      animation: typing 1s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }

    /* COMPOSER */

    .composer-wrapper {
      position: fixed;

      left: 285px;
      right: 0;

      bottom: 0;

      padding:
        18px 20px 20px;

      background:
        linear-gradient(
          transparent,
          rgba(7, 7, 17, 0.97) 40%
        );
    }

    .composer {
      width: min(950px, 100%);

      margin: auto;

      display: flex;

      align-items: flex-end;

      gap: 8px;

      padding: 9px;

      border: 1px solid
        rgba(255, 255, 255, 0.13);

      border-radius: 20px;

      background:
        rgba(18, 18, 31, 0.92);

      box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.35);
    }

    .composer:focus-within {
      border-color:
        rgba(139, 92, 246, 0.55);

      box-shadow:
        0 0 0 3px
        rgba(139, 92, 246, 0.07);
    }

    textarea {
      flex: 1;

      min-height: 48px;
      max-height: 150px;

      padding: 11px;

      resize: none;

      border: none;

      outline: none;

      color: white;

      background: transparent;

      line-height: 1.5;

      font-size: 15px;
    }

    textarea::placeholder {
      color: #66687d;
    }

    .send-button {
      width: 48px;
      height: 48px;

      border: none;

      border-radius: 14px;

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--pink),
          var(--cyan)
        );

      font-size: 20px;

      cursor: pointer;

      transition: 0.2s;
    }

    .send-button:hover {
      transform: scale(1.05);
    }

    .send-button:disabled {
      opacity: 0.4;

      cursor: not-allowed;
    }

    .hint {
      margin-top: 7px;

      text-align: center;

      color: #55576b;

      font-size: 10px;
    }

    /* ANIMATIONS */

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes float {
      50% {
        transform: translateY(-7px);
      }
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        transform: translateY(0);
        opacity: 0.3;
      }

      30% {
        transform: translateY(-5px);
        opacity: 1;
      }
    }

    /* MOBILE */

    @media (max-width: 800px) {

      .sidebar {
        position: fixed;

        top: 0;
        bottom: 0;
        left: -300px;

        z-index: 20;

        box-shadow:
          25px 0 70px rgba(0, 0, 0, 0.5);
      }

      .sidebar.open {
        left: 0;
      }

      .menu-button {
        display: block;
      }

      .online {
        display: none;
      }

      .topbar {
        padding: 0 14px;
      }

      .composer-wrapper {
        left: 0;

        padding:
          10px 10px 13px;
      }

      .chat {
        padding:
          18px 11px 165px;
      }

      .cards {
        grid-template-columns:
          repeat(2, 1fr);
      }
    }

    @media (max-width: 430px) {

      .welcome h1 {
        font-size: 36px;
      }

      .welcome p {
        font-size: 14px;
      }

      .card {
        min-height: 105px;

        padding: 12px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar" id="sidebar">

    <div class="logo">
      <div class="logo-icon">
        ⚡
      </div>

      <span>Zyro AI</span>
    </div>

    <button
      class="new-chat"
      onclick="newChat()"
    >

    </button>

    <div class="section-title">

    </div>

    <div class="history">

      </div>
    </div>

    <div class="sidebar-bottom">
      Zyro AI<br>
      Powered by Cloudflare Workers AI<br>

    </div>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <header class="topbar">

      <div class="top-left">

        <button
          class="menu-button"
          onclick="toggleSidebar()"
        >

        </button>

        </div>

      </div>

      <div class="online">

      </div>

    </header>


    <!-- CHAT -->

    <section class="chat" id="chat">

      <div class="inner" id="inner">

        <div
          class="welcome"
          id="welcome"
        >

          <div class="orb">
            ✨
          </div>

          <h1>
            Привет! Я
            <span class="gradient">

            </span>
          </h1>

          <p>
            Твой быстрый AI-помощник для идей,
            программирования, учёбы, текстов

          </p>


          <div class="cards">

            <button
              class="card"
              onclick="suggest('Создай современный сайт-портфолио на HTML и CSS')"
            >
              <div class="card-icon">
                💻
              </div>

              <b>
                Создать сайт
              </b>

              <span>
                Красивый интерфейс с нуля
              </span>
            </button>


            <button
              class="card"
              onclick="suggest('Объясни искусственный интеллект простыми словами')"
            >
              <div class="card-icon">
                🧠
              </div>

              <b>
                Объяснить
              </b>

              <span>
                Сложное простыми словами
              </span>
            </button>


            <button
              class="card"
              onclick="suggest('Придумай 10 необычных идей для проекта')"
            >
              <div class="card-icon">
                💡
              </div>

              <b>
                Придумать
              </b>

              <span>
                Идеи для проектов
              </span>
            </button>


            <button
              class="card"
              onclick="suggest('Напиши JavaScript код для красивого интерактивного меню')"
            >
              <div class="card-icon">
                ⚙️
              </div>

              <b>
                Написать код
              </b>

              <span>
                HTML, CSS, JS и другое
              </span>
            </button>

          </div>

        </div>

      </div>

    </section>

  </main>

</div>


<!-- INPUT -->

<div class="composer-wrapper">

  <div class="composer">

    <textarea
      id="input"
      rows="1"
      placeholder="Спросите что-нибудь у Zyro AI..."
      autocomplete="off"
    ></textarea>

    <button
      class="send-button"
      id="send"
      onclick="sendMessage()"
    >
      ➤
    </button>

  </div>

  <div class="hint">
    Enter — отправить · Shift + Enter — новая строка
  </div>

</div>


<script>

  /*
    ============================
       CLOUDFLARE API
    ============================
  */

  const API_URL =
    "https://calm-rice-2fe8zyro-ai-api.maksimcodify20.workers.dev";


  let messages = [];


  const inner =
    document.getElementById("inner");

  const input =
    document.getElementById("input");

  const send =
    document.getElementById("send");

  const chat =
    document.getElementById("chat");


  /*
    ============================
       SAVE
    ============================
  */

  function saveMessages() {

    localStorage.setItem(
      "zyro_messages",
      JSON.stringify(messages)
    );

  }


  /*
    ============================
       SCROLL
    ============================
  */

  function scrollBottom() {

    setTimeout(() => {

      chat.scrollTo({
        top: chat.scrollHeight,
        behavior: "smooth"
      });

    }, 30);

  }


  /*
    ============================
       ADD MESSAGE
    ============================
  */

  function addMessage(
    role,
    content,
    save = true
  ) {

    const message =
      document.createElement("div");

    message.className =
      "message " +
      (role === "user"
        ? "user"
        : "ai");


    const avatar =
      document.createElement("div");

    avatar.className =
      "avatar";

    avatar.textContent =
      role === "user"
        ? "👤"
        : "⚡";


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";

    bubble.textContent =
      content;


    message.appendChild(avatar);

    message.appendChild(bubble);


    /*
      COPY BUTTON
    */

    if (role === "assistant") {

      const actions =
        document.createElement("div");

      actions.className =
        "actions";


      const copy =
        document.createElement("button");

      copy.className =
        "copy-button";

      copy.textContent =
        "Копировать";


      copy.onclick = () => {

        navigator.clipboard
          ?.writeText(content);

        copy.textContent =
          "Скопировано ✓";

        setTimeout(() => {

          copy.textContent =
            "Копировать";

        }, 1500);

      };


      actions.appendChild(copy);

      bubble.appendChild(actions);

    }


    inner.appendChild(message);


    if (save) {

      messages.push({
        role: role,
        content: content
      });

      saveMessages();

    }


    scrollBottom();

  }


  /*
    ============================
       TYPING
    ============================
  */

  function showTyping() {

    removeTyping();


    const message =
      document.createElement("div");

    message.id =
      "typing-message";

    message.className =
      "message ai";


    message.innerHTML = `

      <div class="avatar">
        ⚡
      </div>

      <div class="bubble">

        <div class="typing">

          <span></span>
          <span></span>
          <span></span>

        </div>

      </div>

    `;


    inner.appendChild(message);

    scrollBottom();

  }


  function removeTyping() {

    const typing =
      document.getElementById(
        "typing-message"
      );

    if (typing) {

      typing.remove();

    }

  }


  /*
    ============================
       SEND
    ============================
  */

  async function sendMessage() {

    const text =
      input.value.trim();


    if (!text || send.disabled) {
      return;
    }


    const welcome =
      document.getElementById(
        "welcome"
      );


    if (welcome) {
      welcome.remove();
    }


    addMessage(
      "user",
      text
    );


    input.value = "";

    resizeInput();


    send.disabled = true;

    showTyping();


    try {

      const response =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({
                messages:
                  messages
              })
          }
        );


      let data = {};


      try {

        data =
          await response.json();

      } catch {

        data = {};

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Ошибка сервера"
        );

      }


      if (!data.answer) {

        throw new Error(
          "AI не вернул ответ"
        );

      }


      removeTyping();


      addMessage(
        "assistant",
        data.answer
      );


    } catch (error) {

      removeTyping();


      addMessage(
        "assistant",
        "❌ Не удалось получить ответ.\n\n" +
        error.message
      );


    } finally {

      send.disabled = false;

      input.focus();

    }

  }


  /*
    ============================
       SUGGESTION
    ============================
  */

  function suggest(text) {

    input.value =
      text;

    input.focus();

    sendMessage();

  }


  /*
    ============================
       TEXTAREA SIZE
    ============================
  */

  function resizeInput() {

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        150
      ) + "px";

  }


  input.addEventListener(
    "input",
    resizeInput
  );


  /*
    ============================
       ENTER
    ============================
  */

  input.addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }
  );


  /*
    ============================
       NEW CHAT
    ============================
  */

  function newChat() {

    messages = [];

    localStorage.removeItem(
      "zyro_messages"
    );

    location.reload();

  }


  /*
    ============================
       MOBILE SIDEBAR
    ============================
  */

  function toggleSidebar() {

    document
      .getElementById("sidebar")
      .classList.toggle("open");

  }


  /*
    ============================
       LOAD HISTORY
    ============================
  */

  try {

    const saved =
      JSON.parse(
        localStorage.getItem(
          "zyro_messages"
        ) || "[]"
      );


    if (saved.length > 0) {

      messages =
        saved;


      const welcome =
        document.getElementById(
          "welcome"
        );


      if (welcome) {
        welcome.remove();
      }


      saved.forEach(
        message => {

          addMessage(
            message.role,
            message.content,
            false
          );

        }
      );

    }

  } catch (error) {

    console.log(
      "History error:",
      error
    );

  }


  input.focus();

</script>

</body>
</html>
