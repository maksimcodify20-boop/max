<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zyro AI — Умный помощник</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #090914;
  color: #fff;
}

.app {
  max-width: 950px;
  height: 100dvh;
  min-height: 450px;
  margin: auto;
  display: flex;
  flex-direction: column;
  background: #10101c;
}

header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 18px;
  border-bottom: 1px solid #292940;
}

.logo {
  width: 45px;
  height: 45px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: linear-gradient(135deg, #8b5cf6, #22d3ee);
  font-size: 24px;
  font-weight: bold;
}

header h1 {
  font-size: 20px;
  margin: 0 0 5px;
}

header p {
  margin: 0;
  color: #aaaac2;
  font-size: 12px;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.welcome {
  text-align: center;
  margin: 65px auto 30px;
}

.spark {
  font-size: 55px;
  color: #a78bfa;
}

.welcome h2 {
  font-size: 27px;
}

.welcome p {
  color: #aaaac2;
  line-height: 1.7;
}

.message {
  padding: 14px;
  border-radius: 16px;
  margin: 14px 0;
  max-width: 90%;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.user {
  margin-left: auto;
  background: #35245e;
  border: 1px solid #60449a;
}

.ai {
  background: #1b1b2b;
  border: 1px solid #303047;
}

.attachments {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 12px;
}

.file-card {
  width: 135px;
  padding: 8px;
  background: #151522;
  border: 1px solid #42425c;
  border-radius: 12px;
  font-size: 12px;
}

.file-card img {
  width: 100%;
  height: 90px;
  object-fit: cover;
  border-radius: 8px;
}

.file-icon {
  height: 70px;
  display: grid;
  place-items: center;
  font-size: 34px;
}

.filename {
  margin-top: 7px;
  overflow-wrap: anywhere;
}

.filesize {
  color: #aaaac2;
  margin-top: 4px;
}

.composer {
  padding: 14px;
  background: #131320;
  border-top: 1px solid #292940;
}

#preview {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 10px;
}

.preview-item {
  position: relative;
  width: 80px;
  height: 80px;
  overflow: hidden;
  border: 1px solid #555572;
  border-radius: 10px;
  background: #202033;
}

.preview-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.preview-icon {
  display: grid;
  place-items: center;
  height: 100%;
  font-size: 30px;
}

.remove {
  position: absolute;
  right: 3px;
  top: 3px;
  width: 23px;
  height: 23px;
  border: 0;
  border-radius: 50%;
  background: #ef476f;
  color: white;

.input-row {
  display: flex;
  align-items: flex-end;
  gap: 9px;
}

  flex: 1;

  height: 50px;

  padding: 15px;
  border-radius: 13px;
  border: 1px solid #393951;
  background: #1b1b2b;
  color: white;

  outline: none;
}

  border-color: #8b5cf6;
}

button {
  font-family: inherit;
}

.attach-btn, #send {
  height: 50px;
  min-width: 50px;
  border-radius: 13px;
  cursor: pointer;
  color: white;
  font-size: 18px;
}

.attach-btn {
  background: #242439;
  border: 1px solid #41415d;
}

#send {
  padding: 0 17px;
  background: linear-gradient(135deg, #8b5cf6, #6366f1);
  border: 0;
  font-weight: bold;
}

  filter: brightness(1.15);

  display: none;
}

  color: #85859f;

  margin: 9px 2px 0;
}

  #chat {
    padding: 12px;
  }

  .composer {
    padding: 9px;
  }

  .welcome {
    margin-top: 40px;
  }

  .welcome h2 {
    font-size: 23px;
  }

    padding: 0 12px;
  }
}
</style>
</head>

<body>
<div class="app">

  <header>
    <div class="logo">Z</div>
    <div>
      <h1>Zyro AI</h1>
      <p>Твой умный AI-помощник</p>
    </div>
  </header>

  <main id="chat">
    <div class="welcome" id="welcome">
      <div class="spark">✦</div>
      <h2>Привет! Я Zyro AI</h2>
      <p>
        Напиши сообщение или прикрепи картинку,
        PDF и другие файлы с компьютера.
      </p>
    </div>
  </main>

  <section class="composer">
    <div id="preview"></div>

    <input
      id="fileInput"
      type="file"
      multiple
      accept="image/*,.pdf,.txt,.doc,.docx,.csv,.json,.xlsx,.xls,.zip"
    >

    <div class="input-row">
      <button class="attach-btn" id="attach"
        type="button" title="Прикрепить файл">📎</button>

      <textarea id="prompt"
        placeholder="Спроси что-нибудь..."
        rows="1"></textarea>

      <button id="send" type="button">➤</button>
    </div>

    <div class="hint">
      📎 Несколько файлов · До 10 МБ на файл
    </div>
  </section>
</div>

<script>
const chat = document.getElementById("chat");
const promptBox = document.getElementById("prompt");
const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");

let selectedFiles = [];
const MAX_SIZE = 10 * 1024 * 1024;

function formatSize(size) {
  if (size < 1024) return size + " Б";
  if (size < 1024 * 1024)
    return (size / 1024).toFixed(1) + " КБ";
  return (size / (1024 * 1024)).toFixed(1) + " МБ";
}

function renderPreview() {
  preview.replaceChildren();

  selectedFiles.forEach((file, index) => {
    const item = document.createElement("div");
    item.className = "preview-item";

    if (file.type.startsWith("image/")) {
      const img = document.createElement("img");
      img.src = URL.createObjectURL(file);
      img.alt = file.name;
      item.appendChild(img);
    } else {
      const icon = document.createElement("div");
      icon.className = "preview-icon";
      icon.textContent = "📄";
      item.appendChild(icon);
    }

    const remove = document.createElement("button");
    remove.className = "remove";
    remove.textContent = "×";
    remove.type = "button";
    remove.title = "Удалить файл";

    remove.onclick = () => {
      selectedFiles.splice(index, 1);
      renderPreview();
    };

    item.appendChild(remove);
    preview.appendChild(item);
  });
}

document.getElementById("attach").onclick = () => {
  fileInput.click();
};

fileInput.onchange = () => {
  for (const file of fileInput.files) {
    if (file.size > MAX_SIZE) {
      alert("Файл " + file.name + " больше 10 МБ.");
      continue;
    }

    const duplicate = selectedFiles.some(f =>
      f.name === file.name &&
      f.size === file.size &&
      f.lastModified === file.lastModified
    );

    if (!duplicate) selectedFiles.push(file);
  }

  fileInput.value = "";
  renderPreview();
};

function showAttachments(container, files) {
  if (!files.length) return;

  const list = document.createElement("div");
  list.className = "attachments";

  files.forEach(file => {
    const card = document.createElement("div");
    card.className = "file-card";

    if (file.type.startsWith("image/")) {
      const img = document.createElement("img");
      img.src = URL.createObjectURL(file);
      img.alt = file.name;
      card.appendChild(img);
    } else {
      const icon = document.createElement("div");
      icon.className = "file-icon";
      icon.textContent = "📄";
      card.appendChild(icon);
    }

    const name = document.createElement("div");
    name.className = "filename";
    name.textContent = file.name;

    const size = document.createElement("div");
    size.className = "filesize";
    size.textContent = formatSize(file.size);

    card.append(name, size);
    list.appendChild(card);
  });

  container.appendChild(list);
}

function sendMessage() {
  const text = promptBox.value.trim();

  if (!text && selectedFiles.length === 0) return;

  document.getElementById("welcome")?.remove();

  const files = [...selectedFiles];

  const userMessage = document.createElement("div");
  userMessage.className = "message user";

  if (text) {
    const content = document.createElement("div");
    content.textContent = text;
    userMessage.appendChild(content);
  }

  showAttachments(userMessage, files);
  chat.appendChild(userMessage);

  const reply = document.createElement("div");
  reply.className = "message ai";

  if (files.length > 0) {
    reply.textContent =
      "📎 Прикреплено файлов: " + files.length +
      ". Они отображаются в чате. Чтобы ИИ мог прочитать " +
      "файлы и анализировать картинки, подключи AI API " +
      "через Cloudflare Worker.";
  } else {
    reply.textContent =
      "Интерфейс работает! Для настоящих ответов ИИ " +
      "подключи свой AI API через Cloudflare Worker.";
  }

  chat.appendChild(reply);

  selectedFiles = [];
  promptBox.value = "";
  renderPreview();

  chat.scrollTop = chat.scrollHeight;
}

document.getElementById("send").onclick = sendMessage;

promptBox.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});
</script>
</body>
</html>
